# =============================================================================
# SPRING DATA JPA — MINI CURSO
# Configurações explicadas para aprendizado
# =============================================================================

# -----------------------------------------------------------------------------
# BANCO DE DADOS H2 (em memória — reinicia com a aplicação)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:springdatadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 — acesse http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------------------------------------
# create-drop: cria as tabelas ao iniciar e dropa ao encerrar (bom para estudo)
# update     : mantém tabelas e atualiza a estrutura (dev)
# validate   : só valida — não cria nem altera (produção)
# none       : não faz nada com o schema (produção com migrations)
spring.jpa.hibernate.ddl-auto=create-drop

# LIÇÃO: Mostre o SQL gerado pelo JPA no console
# Em produção, desative para não poluir logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LIÇÃO: Mostre os valores dos parâmetros (binds) nas queries
# Muito útil para debugar consultas
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.SQL=DEBUG

# LIÇÃO: Estatísticas do Hibernate (sessions, queries, cache hits)
# Ative para identificar problemas N+1 e performance
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Dialeto — auto-detectado pelo Spring Boot 3, mas pode fixar
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# -----------------------------------------------------------------------------
# ENVERS — Auditoria de histórico
# -----------------------------------------------------------------------------
# Prefixo das tabelas de auditoria (padrão: nenhum)
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=rev_type
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# -----------------------------------------------------------------------------
# OPEN SESSION IN VIEW — IMPORTANTE
# -----------------------------------------------------------------------------
# LIÇÃO: false é a configuração CORRETA para produção.
# Com true (padrão Spring Boot), a sessão JPA fica aberta durante
# toda a requisição HTTP — isso pode mascarar problemas de N+1.
# Com false, o EntityManager fecha antes de chegar na view, forçando
# você a carregar todos os dados necessários no service.
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# SERVIDOR
# -----------------------------------------------------------------------------
server.port=8080
spring.application.name=springdata-minicurso